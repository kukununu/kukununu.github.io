<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Коллекция «Дала» — ӨРНЕК</title>
<meta name="description" content="Шапаны, камзолы и комплекты с казахскими орнаментами. У каждой вещи своё слово и свой узор.">
<meta name="theme-color" content="#F4EFE7">
<link rel="icon" href="assets/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Golos+Text:wght@400;500&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
.top{padding:150px 0 50px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:end}
.top p{color:var(--ink-2);max-width:440px;font-size:17px}
.top h1 .rv>span{animation:up 1.1s var(--ease) both}
.top h1 .rv:nth-child(2)>span{animation-delay:.1s}
@keyframes up{from{transform:translateY(105%)}to{transform:none}}
.bar{display:flex;justify-content:space-between;align-items:center;gap:20px;border-block:1px solid var(--line);padding:6px 0;margin-bottom:44px;position:sticky;top:0;background:var(--bg);z-index:5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{all:unset;cursor:pointer;font:500 11px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;padding:16px 14px;color:var(--muted);transition:color .3s}
.chips button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-underline-offset:6px}
.chips button:hover{color:var(--ink)}
.chips button:focus-visible{outline:2px solid var(--clay)}
.count{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:56px clamp(16px,2vw,32px);padding-bottom:120px}
.tile.big{grid-column:span 2;grid-row:span 2}
.tile.big .ph{aspect-ratio:auto;height:calc(100% - 110px);min-height:420px}
.tile{transition:opacity .45s var(--ease),transform .45s var(--ease)}
.tile.out{opacity:0;transform:translateY(20px)}
.quote{grid-column:span 1;display:flex;flex-direction:column;justify-content:center;padding:40px;background:var(--paper);border:1px solid var(--line)}
.quote p{font:italic 500 clamp(26px,2.4vw,36px)/1.2 var(--serif)}
.quote span{margin-top:20px;font-size:13px;color:var(--muted)}
@media (max-width:1000px){.grid{grid-template-columns:1fr 1fr}.top{grid-template-columns:1fr}}
@media (max-width:640px){.grid{grid-template-columns:1fr}.tile.big{grid-column:auto;grid-row:auto}.tile.big .ph{height:auto;aspect-ratio:3/4;min-height:0}.bar{flex-direction:column;align-items:start}.count{display:none}}
</style>
</head>
<body>
<main id="main" class="px">
  <section class="top">
    <h1><span class="rv"><span>Коллекция</span></span><span class="rv"><span><em>«Дала»</em></span></span></h1>
    <p>Пять вещей. Каждая начинается со слова на казахском и узора, который это слово говорит. Наведите на фото, и узор нарисуется сам.</p>
  </section>
  <div class="bar">
    <div class="chips" role="group" aria-label="Фильтр по типу">
      <button type="button" aria-pressed="true" data-f="">Все</button>
      <button type="button" aria-pressed="false" data-f="Шапан">Шапаны</button>
      <button type="button" aria-pressed="false" data-f="Камзол">Камзолы</button>
      <button type="button" aria-pressed="false" data-f="Комплект">Комплекты</button>
    </div>
    <span class="count" id="count"></span>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script src="data.js"></script>
<script src="site.js"></script>
<script>
const grid = document.getElementById('grid');
const quote = `<div class="quote io" data-type="*"><p>«Шапан не дарят в руки. Его надевают на плечи, и человек становится своим».</p><span>Обычай шапан жабу</span></div>`;
grid.innerHTML = tile(ITEMS[0], '(max-width:640px) 100vw, 66vw').replace('class="tile', 'class="tile big') + ITEMS.slice(1, 3).map(i => tile(i)).join('') + quote + ITEMS.slice(3).map(i => tile(i)).join('');
const count = n => document.getElementById('count').textContent = n + ' ' + (n === 1 ? 'вещь' : n < 5 ? 'вещи' : 'вещей');
count(ITEMS.length);
document.querySelectorAll('.chips button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.chips button').forEach(x => x.setAttribute('aria-pressed', x === b));
  const f = b.dataset.f; let n = 0;
  grid.querySelectorAll('[data-type]').forEach(el => {
    const show = !f || el.dataset.type === f; if (show && el.dataset.type !== '*') n++;
    if (show) { el.hidden = false; requestAnimationFrame(() => el.classList.remove('out')); }
    else { el.classList.add('out'); setTimeout(() => el.classList.contains('out') && (el.hidden = true), 450); }
  });
  count(n);
});
</script>
</body>
</html>
