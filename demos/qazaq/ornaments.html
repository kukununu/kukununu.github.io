<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Словарь орнаментов — ӨРНЕК</title>
<meta name="description" content="Что значат казахские узоры: қошқар мүйіз, түйе табан, құс қанаты, тұмарша, төрт құлақ. Найдите свой узор.">
<meta name="theme-color" content="#15110E">
<link rel="icon" href="assets/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Golos+Text:wght@400;500&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
body{background:var(--ink);color:var(--bg)}
.nav.solid{background:#15110eee;color:var(--bg);border-color:#ffffff1a}
.quiz{min-height:100svh;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;padding-block:130px 80px}
.quiz h1 em,.row h2 em{color:#E7C47A}
.quiz h1 .rv>span{animation:up 1.1s var(--ease) both}
.quiz h1 .rv:nth-child(2)>span{animation-delay:.1s}
@keyframes up{from{transform:translateY(105%)}to{transform:none}}
.quiz .q{margin-top:40px;font-size:17px;color:#cfc4b8}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.opts button{all:unset;cursor:pointer;border:1px solid #ffffff40;padding:14px 22px;border-radius:999px;font-size:15px;transition:background .3s,color .3s,border-color .3s}
.opts button:hover{border-color:var(--bg)}
.opts button[aria-pressed=true]{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.opts button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.ans{position:relative;aspect-ratio:1;max-width:540px;width:100%;justify-self:center;color:var(--gold)}
.ans .orn{position:absolute;inset:0;stroke-width:1.3;opacity:0;transition:stroke-dashoffset 2s var(--ease),opacity .4s}
.ans .orn.on{opacity:1;stroke-dashoffset:0}
.res{margin-top:34px;min-height:150px;border-top:1px solid #ffffff22;padding-top:24px}
.res b{display:block;font:500 34px/1.1 var(--serif)}
.res p{color:#cfc4b8;margin:8px 0 16px;max-width:520px}
.res a{color:var(--gold)}
.row{display:grid;grid-template-columns:.8fr 1.2fr .8fr;gap:50px;align-items:center;min-height:100svh;padding-block:90px;border-top:1px solid #ffffff1a}
.row .big{color:var(--gold);max-width:420px;width:100%}
.row .big .orn{stroke-width:1.4}
.row .num{font:500 13px/1 var(--sans);letter-spacing:.2em;color:var(--gold)}
.row h2{margin:16px 0 6px}
.row .ru{font:italic 500 24px/1.2 var(--serif);color:#cfc4b8}
.row p{color:#ddd3c7;font-size:18px;margin-top:22px;max-width:520px}
.row .tile h3{color:var(--bg)}
.row .tile .line{color:#bdb2a6}
@media (max-width:1000px){.quiz,.row{grid-template-columns:1fr}.row .tile{max-width:420px}.row .big{max-width:260px}}
</style>
</head>
<body>
<main id="main" class="px">
  <section class="quiz">
    <div>
      <span class="cap" style="color:var(--gold)">Словарь орнаментов</span>
      <h1 style="margin-top:18px"><span class="rv"><span>Найдите</span></span><span class="rv"><span>свой <em>узор</em></span></span></h1>
      <p class="q">Что вы хотите пожелать себе или человеку, которому дарите?</p>
      <div class="opts" role="group" aria-label="Пожелание" id="opts"></div>
      <div class="res" id="res" aria-live="polite"></div>
    </div>
    <div class="ans" id="ans"></div>
  </section>
  <div id="rows"></div>
</main>
<script src="data.js"></script>
<script src="site.js"></script>
<script>
const keys = Object.keys(ORN);
const wish = {horn:'Достатка', tuye:'Доброй дороги', qus:'Смелой мечты', tumar:'Защиты', tort:'Тёплого дома'};
const itemOf = k => ITEMS.find(i => i.orn === k);
document.getElementById('ans').innerHTML = keys.map(k => svgOrn(k)).join('');
document.getElementById('opts').innerHTML = keys.map(k => `<button type="button" aria-pressed="false" data-k="${k}">${wish[k]}</button>`).join('');
const choose = k => {
  document.querySelectorAll('#ans .orn').forEach((s, i) => s.classList.toggle('on', keys[i] === k));
  document.querySelectorAll('#opts button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k));
  const it = itemOf(k);
  document.getElementById('res').innerHTML = `<b>${ORN[k].kz}</b><p>${ORN[k].ru}. ${ORN[k].text}</p><a class="u" href="product.html?id=${it.id}">Этот узор на вещи: ${it.name}</a>`;
};
document.querySelectorAll('#opts button').forEach(b => b.onclick = () => choose(b.dataset.k));
choose('horn');

document.getElementById('rows').innerHTML = keys.map((k, n) => { const it = itemOf(k); return `
<section class="row io" id="${k}">
  <div class="big">${svgOrn(k)}</div>
  <div><span class="num">0${n + 1} / 0${keys.length}</span><h2>${ORN[k].kz}</h2><span class="ru">${ORN[k].ru} · ${ORN[k].means.toLowerCase()}</span><p>${ORN[k].text}</p></div>
  ${tile(it, '(max-width:1000px) 100vw, 25vw')}
</section>`; }).join('');
</script>
</body>
</html>
